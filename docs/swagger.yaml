basePath: /
definitions:
  domain.DuitkuCallbackPayload:
    properties:
      amount:
        type: string
      merchantCode:
        type: string
      merchantOrderId:
        type: string
      merchantUserId:
        type: string
      paymentCode:
        type: string
      productDetail:
        type: string
      reference:
        type: string
      resultCode:
        type: string
      settlementDate:
        type: string
      signature:
        type: string
    required:
    - amount
    - merchantCode
    - merchantOrderId
    - resultCode
    - signature
    type: object
  domain.ErrorResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
  domain.GenerateSubscriptionPaymentRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - quarterly
        - yearly
        type: string
      class_id:
        type: string
      discount_amount:
        minimum: 0
        type: integer
      enrollment_id:
        type: string
      parent_id:
        type: string
      payment_gateway_fee:
        minimum: 0
        type: integer
      platform_fee:
        minimum: 0
        type: integer
      sender_email:
        type: string
      sender_name:
        type: string
      sender_phone:
        type: string
      student_id:
        type: string
      subtotal_amount:
        type: integer
      tenant_id:
        type: string
      title:
        type: string
      voucher_id:
        type: string
    required:
    - billing_cycle
    - class_id
    - enrollment_id
    - parent_id
    - student_id
    - subtotal_amount
    - tenant_id
    type: object
  domain.GenerateSubscriptionPaymentResponse:
    properties:
      checkout_session_url:
        type: string
      gross_amount:
        type: integer
      payment_intent_id:
        type: string
      status:
        type: string
      transaction_id:
        type: string
    type: object
  domain.HTTPResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
  domain.TransactionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/domain.TransactionResponse'
        type: array
      pagination:
        properties:
          page:
            type: integer
          page_size:
            type: integer
          total_items:
            type: integer
          total_pages:
            type: integer
        type: object
    type: object
  domain.TransactionResponse:
    properties:
      checkout_session_url:
        type: string
      created_at:
        type: string
      currency:
        type: string
      discount_amount:
        type: integer
      enrollment_id:
        type: string
      gross_amount:
        type: integer
      id:
        type: string
      merchant_order_id:
        type: string
      net_amount:
        type: integer
      paid_at:
        type: string
      parent_id:
        type: string
      payment_gateway_fee:
        type: integer
      payment_gateway_provider:
        type: string
      payment_intent_id:
        type: string
      platform_fee:
        type: integer
      status:
        type: string
      student_id:
        type: string
      subtotal_amount:
        type: integer
      tenant_id:
        type: string
      updated_at:
        type: string
      voucher_id:
        type: string
    type: object
info:
  contact: {}
  description: Billing and Payment Service for KelolaKelas Platform
  title: KelolaKelas Billing Service API
  version: "1.0"
paths:
  /api/v1/billing/transactions:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.TransactionListResponse'
              type: object
      security:
      - BearerAuth: []
      summary: List billing transactions
      tags:
      - Billing
  /api/v1/billing/transactions/{id}:
    get:
      parameters:
      - description: Transaction UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.TransactionResponse'
              type: object
      security:
      - BearerAuth: []
      summary: Get billing transaction
      tags:
      - Billing
  /api/v1/billing/webhooks/duitku:
    post:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: Callback endpoint for Duitku payment status updates
      parameters:
      - description: Duitku callback payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/domain.DuitkuCallbackPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Handle Duitku payment webhook callback
      tags:
      - Billing
  /internal/billing/transactions:
    post:
      consumes:
      - application/json
      description: Internal service-to-service endpoint for generating a billing invoice.
      parameters:
      - description: Payment request details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.GenerateSubscriptionPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/domain.GenerateSubscriptionPaymentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/domain.ErrorResponse'
      summary: Generate subscription payment from an internal service
      tags:
      - Billing
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
