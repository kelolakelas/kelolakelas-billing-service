  /api/v1/billing/transactions/export:
    get:
      description: 'Tenant members with billing:read only; parents are forbidden.
        Accepts the same filters as the list (status, student_id, enrollment_id, search,
        date_from, date_to, date_by) but defaults to paid transactions on the paid
        date over the last 30 UTC days, so the default export reconciles with the
        sales summary. Days are inclusive YYYY-MM-DD UTC (ADR 0039: a UTC day ends
        at 07:00 WIB), at most 366 calendar days. Rows stream in batches, so a full-range
        export never loads fully into memory. Cells starting with `=`, `+`, `-`, or
        `@` carry a leading single quote so spreadsheets render them as text.'
      parameters:
      - description: Transaction status, defaults to paid
        in: query
        name: status
        type: string
      - description: Student UUID
        in: query
        name: student_id
        type: string
      - description: Enrollment UUID
        in: query
        name: enrollment_id
        type: string
