basePath: /
definitions:
  github_com_kelolakelas-id_kelolakelas-billing-service_internal_domain.ErrorResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
  github_com_kelolakelas-id_kelolakelas-billing-service_internal_domain.FlipWebhookPayload:
    properties:
      data: {}
      token:
        type: string
    type: object
  github_com_kelolakelas-id_kelolakelas-billing-service_internal_domain.GenerateSubscriptionPaymentRequest:
    properties:
      discount_amount:
        minimum: 0
        type: integer
      enrollment_id:
        type: string
      platform_fee:
        minimum: 0
        type: integer
      subtotal_amount:
        type: integer
      tenant_id:
        type: string
      title:
        type: string
      voucher_id:
        type: string
    required:
    - enrollment_id
    - subtotal_amount
    - tenant_id
