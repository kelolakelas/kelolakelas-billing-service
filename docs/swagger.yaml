        in: query
        name: search
        type: string
      - description: First UTC date (YYYY-MM-DD)
        in: query
        name: date_from
        type: string
      - description: Last UTC date (YYYY-MM-DD)
        in: query
        name: date_to
        type: string
      - description: 'Date basis: created_at or paid_at, defaults to paid_at'
        in: query
        name: date_by
        type: string
