  /internal/billing/reconciliations:
    get:
      description: Internal service-to-service endpoint for operators. Returns the
        durable reconciliation jobs of enrollment activation and seat release so a
        permanently failed job can be found without a provider callback. Without `status`
        every row is returned.
      parameters:
      - description: 'Reconciliation status: pending, processing, active, or terminal_failed'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ReconciliationListResponse'
              type: object
