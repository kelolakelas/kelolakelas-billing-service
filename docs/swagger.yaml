        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      summary: Requeue permanently failed payment reconciliations
      tags:
      - Billing
