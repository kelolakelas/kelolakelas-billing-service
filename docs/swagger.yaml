      summary: List payment reconciliations by status
      tags:
      - Billing
  /internal/billing/reconciliations/requeue:
    post:
      description: 'Internal service-to-service endpoint for operators. Moves reconciliation
        jobs that exhausted the attempt limit back to `pending` so the worker retries
        them without a provider callback. The transition is idempotent: only `terminal_failed`
        rows are affected, so an already active or in-flight job is never reset.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ReconciliationRequeueResponse'
              type: object
        "500":
