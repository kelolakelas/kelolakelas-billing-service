basePath: /
definitions:
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.CancelEnrollmentPaymentRequest:
    properties:
      enrollment_id:
        type: string
    required:
    - enrollment_id
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.DuitkuCallbackPayload:
    properties:
      amount:
        type: string
      merchantCode:
        type: string
      merchantOrderId:
        type: string
      merchantUserId:
        type: string
      paymentCode:
        type: string
      productDetail:
        type: string
      reference:
        type: string
      resultCode:
        type: string
      settlementDate:
        type: string
      signature:
        type: string
    required:
    - amount
    - merchantCode
    - merchantOrderId
    - resultCode
    - signature
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.GenerateSubscriptionPaymentRequest:
    properties:
      billing_cycle:
        enum:
        - monthly
        - quarterly
        - yearly
        type: string
      class_id:
        type: string
      discount_amount:
        minimum: 0
        type: integer
      enrollment_id:
        type: string
      parent_id:
        type: string
      payment_gateway_fee:
        minimum: 0
        type: integer
      platform_fee:
        minimum: 0
        type: integer
      sender_email:
        description: |-
          SenderEmail is optional during the rollout. A non-empty value must be a real
          email address: the binding rejects anything else before any transaction or
          subscription row is written (KEL-75).
        type: string
      sender_name:
        type: string
      sender_phone:
        type: string
      student_id:
        type: string
      subtotal_amount:
        type: integer
      tenant_id:
        type: string
      title:
        type: string
      voucher_id:
        type: string
    required:
    - billing_cycle
    - class_id
    - enrollment_id
    - parent_id
    - student_id
    - subtotal_amount
    - tenant_id
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.GenerateSubscriptionPaymentResponse:
    properties:
      checkout_session_url:
        type: string
      gross_amount:
        type: integer
      payment_intent_id:
        type: string
      status:
        type: string
      transaction_id:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse:
    properties:
      data: {}
      message:
        type: string
      status:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.PaymentReconciliation:
    properties:
      attempt_count:
        type: integer
      completed_at:
        type: string
      created_at:
        type: string
      enrollment_id:
        type: string
      id:
        type: string
      kind:
        type: string
      last_attempt_at:
        type: string
      last_error:
        type: string
      next_attempt_at:
        type: string
      status:
        type: string
      transaction_id:
        type: string
      updated_at:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ReconciliationListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.PaymentReconciliation'
        type: array
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ReconciliationRequeueResponse:
    properties:
      requeued:
        type: integer
      requeued_at:
        type: string
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.TransactionListResponse:
    properties:
      items:
        items:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.TransactionResponse'
        type: array
      pagination:
        properties:
          page:
            type: integer
          page_size:
            type: integer
          total_items:
            type: integer
          total_pages:
            type: integer
        type: object
    type: object
  github_com_kelolakelas_kelolakelas-billing-service_internal_domain.TransactionResponse:
    properties:
      checkout_session_url:
        type: string
      created_at:
        type: string
      currency:
        type: string
      discount_amount:
        type: integer
      enrollment_id:
        type: string
      expired_at:
        type: string
      gross_amount:
        type: integer
      id:
        type: string
      invoice_claimed_at:
        type: string
      invoice_expires_at:
        type: string
      invoice_failure_reason:
        type: string
      merchant_order_id:
        type: string
      net_amount:
        type: integer
      paid_at:
        type: string
      parent_id:
        type: string
      payment_gateway_fee:
        type: integer
      payment_gateway_provider:
        type: string
      payment_intent_id:
        type: string
      platform_fee:
        type: integer
      reconciliation_attempts:
        type: integer
      reconciliation_kind:
        type: string
      reconciliation_last_error:
        type: string
      reconciliation_next_attempt_at:
        type: string
      reconciliation_status:
        type: string
      status:
        type: string
      student_id:
        type: string
      subtotal_amount:
        type: integer
      tenant_id:
        type: string
      updated_at:
        type: string
      voucher_id:
        type: string
    type: object
info:
  contact: {}
  description: Billing and Payment Service for KelolaKelas Platform
  title: KelolaKelas Billing Service API
  version: "1.0"
paths:
  /api/v1/billing/transactions:
    get:
      description: 'Parents see their own transactions. Tenant members need the `billing:read`
        permission in their tenant: without it the answer is 403, and while identity
        cannot be asked it is 503.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.TransactionListResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List billing transactions
      tags:
      - Billing
  /api/v1/billing/transactions/{id}:
    get:
      description: 'Same authorization as the list: parents read their own transaction,
        tenant members need `billing:read` (403 without it, 503 while identity cannot
        be asked).'
      parameters:
      - description: Transaction UUID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.TransactionResponse'
              type: object
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get billing transaction
      tags:
      - Billing
  /api/v1/billing/webhooks/duitku:
    post:
      consumes:
      - application/json
      - application/x-www-form-urlencoded
      description: Callback endpoint for Duitku payment status updates
      parameters:
      - description: Duitku callback payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.DuitkuCallbackPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      summary: Handle Duitku payment webhook callback
      tags:
      - Billing
  /internal/billing/reconciliations:
    get:
      description: Internal service-to-service endpoint for operators. Returns the
        durable reconciliation jobs of enrollment activation and seat release so a
        permanently failed job can be found without a provider callback. Without `status`
        every row is returned.
      parameters:
      - description: 'Reconciliation status: pending, processing, active, or terminal_failed'
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ReconciliationListResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      summary: List payment reconciliations by status
      tags:
      - Billing
  /internal/billing/reconciliations/requeue:
    post:
      description: 'Internal service-to-service endpoint for operators. Moves reconciliation
        jobs that exhausted the attempt limit back to `pending` so the worker retries
        them without a provider callback. The transition is idempotent: only `terminal_failed`
        rows are affected, so an already active or in-flight job is never reset.'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ReconciliationRequeueResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      summary: Requeue permanently failed payment reconciliations
      tags:
      - Billing
  /internal/billing/transactions:
    post:
      consumes:
      - application/json
      description: Internal service-to-service endpoint for generating a billing invoice.
      parameters:
      - description: Payment request details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.GenerateSubscriptionPaymentRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.GenerateSubscriptionPaymentResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      summary: Generate subscription payment from an internal service
      tags:
      - Billing
  /internal/billing/transactions/cancel:
    post:
      consumes:
      - application/json
      description: Internal service-to-service endpoint that marks the unpaid transaction
        of an enrollment as `cancelled`. The transition is idempotent, never rewrites
        a paid or refunded transaction, and reports 404 when the enrollment has no
        transaction at all.
      parameters:
      - description: Enrollment to cancel
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.CancelEnrollmentPaymentRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.HTTPResponse'
            - properties:
                data:
                  $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.TransactionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/github_com_kelolakelas_kelolakelas-billing-service_internal_domain.ErrorResponse'
      summary: Cancel the unpaid transaction of a cancelled enrollment
      tags:
      - Billing
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
